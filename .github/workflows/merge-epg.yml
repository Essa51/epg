name: Merge EPG and M3U
on:
  workflow_dispatch: {}
  push:
    branches: ["**"]
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Check node/npm availability
        run: |
          echo "== Node and NPM versions (if available) =="
          node --version || echo "node not found"
          npm --version || echo "npm not found"

      - name: Run merge script
        run: python merge_epg_m3u.py

      - name: Upload outputs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: merged-epg-m3u-outputs
          path: |
            final_m3u.m3u
            final_epg.xml
            merged_epg_m3u.zip
            reports/**

      - name: Commit results to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add final_m3u.m3u final_epg.xml merged_epg_m3u.zip reports || true
          git commit -m "Update merged EPG and M3U" || echo "No changes to commit"
          git push origin HEAD
